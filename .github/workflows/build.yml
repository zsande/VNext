# Builds VNext for Windows, Linux and macOS, tries each one on GitHub's machines (a small game's story,
# developer mode, and the game packed and played with the player next to it: a screenshot of each), and
# zips each player with licences.txt (VNext-0.3.0-Windows.zip...: the version, then the system; the Linux player is
# an AppImage). Then each system's zip gets the other two systems' players too (bundle), for Export the game. A tag
# like v0.3.0 also makes a release of it, with the three zips and What's new: the release commit's message after its
# first line (write it as a list: "- ..."), or else the commits since the release before. The zips and screenshots are
# in each run's "Artifacts" section.
name: build

# (not for a change to the README, the licence, the README's images or the Sponsor button alone: there's nothing to build)
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', 'LICENCE.txt', '.github/*.png', '.github/FUNDING.yml']
  pull_request:
    paths-ignore: ['README.md', 'LICENCE.txt', '.github/*.png', '.github/FUNDING.yml']
  workflow_dispatch:

# The token each job gets: only what it uses (reading the code; the release's own job writes it).
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      actions: read # (SignPath reads the job's details and downloads the player to sign with it)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, system: Windows }
          - { os: ubuntu-22.04, system: Linux } # (the oldest Linux GitHub has: the player runs on Linux as new as what it's built on)
          - { os: macos-15-intel, system: macOS } # (GitHub's Apple-chip Macs are often all busy; the player is for both kinds anyway)
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test # (GCC 14, for C++26)
          sudo apt-get update
          sudo apt-get install -y g++-14 libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev xvfb
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Use the newest Xcode
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          clang++ --version

      - name: Configure
        working-directory: engine
        run: cmake --preset release

      - name: Build
        working-directory: engine
        run: cmake --build --preset release --parallel 4 # (the runners' 4 cores: with no number, Make starts every file at once and runs out of memory)

      - name: Package
        shell: bash
        run: |
          cmake --install engine/build --prefix dist
          cp engine/licences.txt dist/
          # The samples (engine/sample, packed by the build as sample.vnext: engine/src/Sample.hpp) go at the end of the
          # player, so it's all there is: VNext.exe now, the AppImage once it's made. A Mac's app has them in it already.
          case "$RUNNER_OS" in Windows) py=python ;; *) py=python3 ;; esac
          if [ "$RUNNER_OS" = Windows ]; then "$py" .github/sample.py add dist/VNext.exe dist/sample.vnext && rm dist/sample.vnext; fi
          if [ "$RUNNER_OS" = Linux ]; then
            echo "The Linux player needs glibc $(objdump -T dist/VNext | grep -o 'GLIBC_[0-9.]*' | cut -d_ -f2 | sort -uV | tail -1) or newer."
            # The AppImage: the player, its icon and licences.txt in one file that runs as it is, zipped with
            # licences.txt as the others are. It finds a game next to itself (Engine::gamePlaces).
            # appimagetool and its runtime: versions of their own (the runtime's source goes with each release:
            # the release job's runtime=, runtime_commit= and fuse=; change them with this one).
            mkdir -p AppDir/usr/bin AppDir/usr/share/doc/vnext
            cp dist/VNext AppDir/usr/bin/
            cp dist/licences.txt AppDir/usr/share/doc/vnext/
            cp engine/build/icon.png AppDir/vnext.png
            ln -s usr/bin/VNext AppDir/AppRun
            printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=VNext' 'Comment=Make visual novels, and play them' 'Exec=VNext' 'Icon=vnext' \
              'Categories=Development;Game;' 'Terminal=false' > AppDir/vnext.desktop
            curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
            curl -fsSL -o runtime https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
            chmod +x appimagetool
            APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool --runtime-file runtime AppDir VNext-Linux.AppImage
            rm dist/VNext && mv VNext-Linux.AppImage dist/
            "$py" .github/sample.py add dist/VNext-Linux.AppImage dist/sample.vnext && rm dist/sample.vnext
          fi
          ls -la dist

      - name: Try it
        shell: bash
        timeout-minutes: 10
        run: |
          set -eu
          case "$RUNNER_OS" in
            macOS) player() { "$1/VNext.app/Contents/MacOS/VNext" "${@:2}"; } ;;
            Windows) player() { "$1/VNext.exe" "${@:2}"; } ;;
            Linux) # (the AppImage; without FUSE on GitHub's machines it unpacks itself and runs, as it can anywhere)
              export APPIMAGE_EXTRACT_AND_RUN=1
              player() { xvfb-run -a -s "-screen 0 1600x900x24" "$1/VNext-Linux.AppImage" "${@:2}"; } ;;
          esac
          shot() { [ -s "try/$1" ] || { echo "::error::There's no screenshot try/$1."; exit 1; }; }
          mkdir -p try/game/scripts
          printf '%s\n' 'setting title "Try it"' 'setting save_folder "vnext_try_it"' '' 'scene start' \
            '    This is the first line of the story.' '    And this is the second.' > try/game/scripts/main.vnscript
          player dist --help
          player dist --sample try/sample && [ -f try/sample/scripts/main.vnscript ] || { echo "::error::The samples didn't come out of the player."; exit 1; }
          player dist --game try/sample --data try/sample-data --screenshot try/5-sample.png && shot 5-sample.png
          player dist --game try/game --data try/data --screenshot try/1-story.png && shot 1-story.png
          player dist --data try/developer --screenshot try/2-developer.png && shot 2-developer.png
          player dist --game try/game --data try/data --pack
          ls -la "try/Try it"
          cp -R dist/. "try/Try it/" # (the player next to game.vnext, as players have it)
          made=$(wc -c < "try/Try it/game.vnext" | tr -d ' ')
          player "try/Try it" --scene start --screenshot try/3-packed.png && shot 3-packed.png # (no --data: its autosave goes into game.vnext)
          played=$(wc -c < "try/Try it/game.vnext" | tr -d ' ')
          echo "game.vnext: $made bytes when packed, $played after playing it."
          [ "$played" -gt "$made" ] || { echo "::error::The autosave didn't go into game.vnext."; exit 1; }
          player "try/Try it" --screenshot try/4-packed-again.png && shot 4-packed-again.png # (the pack, read with its save in it)

      - name: The logs, when something went wrong
        if: failure()
        shell: bash
        run: |
          for f in try/data/log.txt try/developer/log.txt "$HOME/Library/Application Support/VNext/vnext_try_it/log.txt" \
                   "$HOME/.local/share/VNext/vnext_try_it/log.txt" "$HOME/AppData/Roaming/VNext/vnext_try_it/log.txt"; do
            if [ -f "$f" ]; then echo "== $f"; cat "$f"; fi
          done

      # Windows releases are signed through SignPath (CODE_SIGNING.md) once its details are in the repository's
      # settings: the variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG,
      # and the secret SIGNPATH_API_TOKEN. The player goes to SignPath, which signs VNext.exe once the release
      # is approved there (within two hours of the tag), and comes back signed into dist/.
      - name: The version to sign
        id: version
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: The player to sign
        id: unsigned
        if: steps.version.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: Unsigned-Windows
          path: dist/

      - name: Sign it (SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.number }}"
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed

      - name: The signed player
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          Copy-Item signed/VNext.exe dist/VNext.exe -Force
          $signature = Get-AuthenticodeSignature dist/VNext.exe
          "VNext.exe: $($signature.Status), by $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw "VNext.exe came back without a valid signature." }

      - name: Zip
        shell: bash
        run: |
          # (named with the version: the tag's, else the one in CMakeLists.txt; and the system)
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' engine/CMakeLists.txt | head -1) ;;
          esac
          file="VNext-$version-${{ matrix.system }}.zip"
          echo "ZIP=$file" >> "$GITHUB_ENV"
          case "$RUNNER_OS" in
            macOS) ditto -c -k --norsrc --noextattr dist "$file" ;; # (as macOS zips an app)
            Linux) (cd dist && zip -r -X "../$file" .) ;;           # (keeps the AppImage a program)
            Windows) (cd dist && cmake -E tar cf "../$file" --format=zip -- *) ;;
          esac
          # Unzipped as someone who downloads it would, it still starts (the AppImage still a program).
          mkdir unzipped
          case "$RUNNER_OS" in
            macOS) ditto -x -k "$file" unzipped && codesign --verify --deep --strict unzipped/VNext.app && unzipped/VNext.app/Contents/MacOS/VNext --help ;;
            Linux) (cd unzipped && unzip -q "../$file") && zipinfo "$file" && [ -x unzipped/VNext-Linux.AppImage ] && APPIMAGE_EXTRACT_AND_RUN=1 unzipped/VNext-Linux.AppImage --help ;;
            Windows) (cd unzipped && cmake -E tar xf "../$file") && unzipped/VNext.exe --help ;;
          esac
          ls -la unzipped

      - uses: actions/upload-artifact@v6
        with:
          name: Player-${{ matrix.system }}
          path: ${{ env.ZIP }}

      - uses: actions/upload-artifact@v6 # (Lanterns, the demo made of the samples, for the release: game.vnext)
        if: runner.os == 'Linux'
        with:
          name: Demo
          path: engine/build/lanterns.vnext

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Screenshots-${{ matrix.system }}
          path: try/*.png
          if-no-files-found: ignore

  # Each system's zip with the other two systems' players in it (players/Windows.zip, players/macOS.zip,
  # players/Linux.zip: their own zips), so Export the game zips a game for every system without downloading anything
  # (Export.cpp reads them): Windows' and Linux's in a folder next to the player, a Mac's in the app (its
  # Resources/players: dragged to Applications, they go with it), the app signed again.
  bundle:
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5 # (the version, on a run that isn't a tag's)

      - uses: actions/download-artifact@v7
        with:
          pattern: Player-*
          merge-multiple: true

      - name: Bundle
        shell: bash
        run: |
          set -eu
          case "$GITHUB_REF" in
            refs/tags/v*) v="${GITHUB_REF_NAME#v}" ;;
            *) v=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' engine/CMakeLists.txt | head -1) ;;
          esac
          mkdir players
          # Each system's player as it goes with the others, without the samples (VNext's, not a game's): unzipped, the
          # samples taken off the end of the .exe and the AppImage or out of the app (signed again), zipped again.
          for s in Windows macOS Linux; do
            mkdir "p-$s"
            if [ "$s" = macOS ]; then
              ditto -x -k "VNext-$v-$s.zip" "p-$s" && rm -f "p-$s/VNext.app/Contents/Resources/sample.vnext"
              codesign --force --sign - "p-$s/VNext.app" && ditto -c -k --norsrc --noextattr "p-$s" "players/$s.zip"
            else
              (cd "p-$s" && unzip -q "../VNext-$v-$s.zip")
              for f in "p-$s/VNext.exe" "p-$s/VNext-Linux.AppImage"; do if [ -f "$f" ]; then python3 .github/sample.py strip "$f"; fi; done
              (cd "p-$s" && zip -q -r -X "../players/$s.zip" .)
            fi
          done
          ls -la players
          for s in Windows Linux; do # (next to the player)
            for o in Windows macOS Linux; do
              if [ "$o" != "$s" ]; then zip -q -X "VNext-$v-$s.zip" "players/$o.zip"; fi
            done
          done
          ditto -x -k "VNext-$v-macOS.zip" mac # (in the app, signed again)
          mkdir mac/VNext.app/Contents/Resources/players
          cp players/Windows.zip players/Linux.zip mac/VNext.app/Contents/Resources/players/
          codesign --force --sign - mac/VNext.app
          codesign --verify --deep --strict mac/VNext.app
          mac/VNext.app/Contents/MacOS/VNext --help
          rm "VNext-$v-macOS.zip"
          ditto -c -k --norsrc --noextattr mac "VNext-$v-macOS.zip"
          for s in Windows macOS Linux; do
            echo "== VNext-$v-$s.zip" && unzip -l "VNext-$v-$s.zip" | grep players/
            [ "$(unzip -l "VNext-$v-$s.zip" | grep -c 'players/[A-Za-z]*\.zip')" -eq 2 ] || { echo "::error::VNext-$v-$s.zip hasn't the other two players."; exit 1; }
          done

      - uses: actions/upload-artifact@v6
        with:
          name: VNext-Windows
          path: VNext-*-Windows.zip

      - uses: actions/upload-artifact@v6
        with:
          name: VNext-macOS
          path: VNext-*-macOS.zip

      - uses: actions/upload-artifact@v6
        with:
          name: VNext-Linux
          path: VNext-*-Linux.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: source
          fetch-depth: 0 # (the commits and tags before it, for What's new)

      - uses: actions/download-artifact@v7
        with:
          pattern: VNext-*
          merge-multiple: true

      - uses: actions/download-artifact@v7 # (lanterns.vnext: the demo)
        with:
          name: Demo

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The source of what's LGPL in the Linux AppImage, attached to the release: libfuse, built into the AppImage's
          # runtime, and the runtime's own source (its libfuse patch, how it builds the libraries, and what libfuse is
          # linked into). The runtime the Linux job puts in (its tag), as that release was built (its commit, and the
          # libfuse version and checksum its scripts/common/install-dependencies.sh pins).
          runtime=20251108 runtime_commit=dd6cebedcbddde9c82f89b011e8e1d40b6e43868
          fuse=3.15.0 fuse_sha256=70589cfd5e1cff7ccd6ac91c86c01be340b227285c5e200baa284e401eea2ca0
          curl -fsSL -o "fuse-$fuse.tar.xz" "https://github.com/libfuse/libfuse/releases/download/fuse-$fuse/fuse-$fuse.tar.xz"
          echo "$fuse_sha256  fuse-$fuse.tar.xz" | sha256sum -c -
          curl -fsSL -o "type2-runtime-$runtime.tar.gz" "https://github.com/AppImage/type2-runtime/archive/$runtime_commit.tar.gz"
          tar -tzf "type2-runtime-$runtime.tar.gz" | grep -q "/patches/libfuse/mount.c.diff$" # (its source, with the patch)

          new=$(git -C source log -1 --format=%b "$GITHUB_SHA" | grep -v '^Co-Authored-By:' || true)
          if [ -z "$new" ]; then # (the commits since the release before)
            last=$(git -C source describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
            new=$(git -C source log --no-merges --format='- %s' ${last:+"$last.."}"$GITHUB_SHA^")
          fi
          printf "## What's new\n\n%s\n\n## Download\n\n" "$new" > notes.md
          v="${GITHUB_REF_NAME#v}"
          cat > download.md <<'EOF'
          Download the zip for your computer, unzip it and open VNext. With no game next to it, it opens in developer mode, where you make one. Export the game (the Game menu) makes your game a zip for Windows, macOS and Linux, each with the game's own player: every VNext carries the other two systems' players (in the players folder next to it; on a Mac, inside the app), so nothing is downloaded. A game.vnext put next to VNext plays too, and keeps its players' saves and progress in that file.

          `game.vnext`, below, is Lanterns: a short game made with the samples New game offers (a cast, places, music and menus). Put it next to VNext and open VNext to play it.

          - **Windows** (10 or newer): `VNext-@V@-Windows.zip`. The first time, Windows may say it protected your PC: click **More info**, then **Run anyway**.
          - **macOS** (13.3 or newer, Apple silicon and Intel): `VNext-@V@-macOS.zip`. The first time, macOS won't open it because Apple hasn't checked it: open **System Settings → Privacy & Security** and click **Open Anyway**.
          - **Linux** (64-bit, as new as Ubuntu 22.04 or Debian 12, or newer): `VNext-@V@-Linux.zip`. VNext in it is an AppImage, `VNext-Linux.AppImage`, one file that runs as it is.

          `licences.txt`, in each zip, lists the software built into VNext and its licences; About shows it too. VNext itself is under the zlib licence. The source of the libfuse built into the Linux AppImage's runtime, and the runtime's own, are attached below: `fuse-@FUSE@.tar.xz` and `type2-runtime-@RUNTIME@.tar.gz`. How the players are signed: [code signing policy](https://github.com/zsande/VNext/blob/main/CODE_SIGNING.md).
          EOF
          sed "s/@V@/$v/g; s/@FUSE@/$fuse/g; s/@RUNTIME@/$runtime/g" download.md >> notes.md # (the zips' and sources' names, with this version)
          mv lanterns.vnext game.vnext
          gh release create "$GITHUB_REF_NAME" "VNext-$v-Windows.zip" "VNext-$v-macOS.zip" "VNext-$v-Linux.zip" \
            "game.vnext#Lanterns, a short game made with VNext's samples: put it next to VNext to play it" \
            "fuse-$fuse.tar.xz#Source: libfuse $fuse (LGPL 2.1, in the Linux AppImage's runtime)" \
            "type2-runtime-$runtime.tar.gz#Source: AppImage runtime $runtime (with its libfuse patch)" \
            --repo "$GITHUB_REPOSITORY" --title "VNext ${GITHUB_REF_NAME#v}" --notes-file notes.md
