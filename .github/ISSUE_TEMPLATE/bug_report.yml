name: Bug report
description: Something in VNext doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting this! The more of it you fill in, the faster it can be fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps that lead to it, one per line, if you know them.
  - type: input
    id: version
    attributes:
      label: VNext version
      description: The first line of About (a button at the foot of the developer tools) names it, for example 0.8.0.
    validations:
      required: true
  - type: dropdown
    id: computer
    attributes:
      label: Computer
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System version
      description: For example Windows 11, macOS 15 or Ubuntu 24.04.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >-
        If you can, paste VNext's log.txt here. It's in a folder inside VNext's folder in your computer's app data:
        %APPDATA%\VNext on Windows, ~/Library/Application Support/VNext on macOS, ~/.local/share/VNext on Linux.
      render: text
  - type: textarea
    id: files
    attributes:
      label: Pictures or files
      description: Screenshots, or a small game that shows the problem. Drag them into this box.
